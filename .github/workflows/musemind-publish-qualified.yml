name: MuseMind publish qualified image to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-qualified-image:
    runs-on: ubuntu-24.04
    environment: develop
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      SOURCE_DIGEST: sha256:66bf84d5668062d1463c96892809737533669d76c51c7e40366a5a26a02fa46b
      SOURCE_REPOSITORY: musemind/develop/rag/ragflow
      SOURCE_TAG: qualified-66bf84d56680
      TARGET_IMAGE: ghcr.io/museminds/ragflow
      TARGET_TAG: 90eb476a92f707bc72f14b19ab11a6ad80ba827f-linux-amd64
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          aws-region: ${{ vars.AWS_REGION_DEVELOP }}
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN_DEVELOP }}

      - id: ecr
        name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Log in to the private MuseMind GHCR package
        shell: bash
        run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Publish the exact qualified manifest without rebuilding
        shell: bash
        run: |
          source_ref="${{ steps.ecr.outputs.registry }}/${SOURCE_REPOSITORY}@${SOURCE_DIGEST}"
          target_ref="${TARGET_IMAGE}:${TARGET_TAG}"

          source_digest="$(aws ecr describe-images \
            --repository-name "${SOURCE_REPOSITORY}" \
            --image-ids "imageTag=${SOURCE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "${source_digest}" = "${SOURCE_DIGEST}"
          docker buildx imagetools inspect "${source_ref}"

          if ! docker buildx imagetools inspect "${target_ref}" >/dev/null 2>&1; then
            docker buildx imagetools create --prefer-index=false --tag "${target_ref}" "${source_ref}"
          fi

          target_digest="$(docker buildx imagetools inspect "${target_ref}" |
            awk '$1 == "Digest:" { print $2; exit }')"
          test "${target_digest}" = "${SOURCE_DIGEST}"

          echo "### Qualified RAGFlow publication" >> "${GITHUB_STEP_SUMMARY}"
          echo "ECR source and GHCR digest: \`${target_digest}\`" >> "${GITHUB_STEP_SUMMARY}"
