name: MuseMind provider contract

on:
  pull_request:
    branches:
      - musemind
  push:
    branches:
      - musemind

permissions:
  contents: read

concurrency:
  group: musemind-provider-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-contract:
    name: musemind-provider-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: 0.11.28

      - name: Install Python 3.13 and locked test environment
        run: |
          uv sync --python 3.13 --group test --frozen
          uv pip install -e sdk/python

      - name: Reject whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

      - name: Require immutable C-01 build inputs
        run: |
          grep -Eq '^ARG UBUNTU_IMAGE=[^ ]+@sha256:[0-9a-f]{64}$' Dockerfile
          grep -Eq '^ARG RAGFLOW_DEPS_IMAGE=[^ ]+@sha256:[0-9a-f]{64}$' Dockerfile
          grep -Eq '^ARG INFINITY_RESOURCE_COMMIT=[0-9a-f]{40}$' Dockerfile
          ! grep -q 'from=infiniflow/ragflow_deps:latest' Dockerfile
          ! grep -Eq 'git clone .*infiniflow/resource' Dockerfile
          grep -Fq 'uv build --wheel --no-build-isolation ./sdk/python --out-dir /ragflow/sdk-dist' Dockerfile
          grep -Fq 'COPY --from=builder /ragflow/sdk-dist /ragflow/sdk-dist' Dockerfile
          grep -Fq 'apt-get purge -y nodejs libssl1.1' Dockerfile
          grep -Fq '/ragflow/tika-server-standard-3.3.0.jar' Dockerfile
          ! grep -q 'AliyunCodeInterpreterProvider' agent/sandbox/providers/__init__.py agent/sandbox/client.py
          ! grep -q 'agentrun-sdk' pyproject.toml

      - name: Verify locked C-01 remediation floors
        run: |
          .venv/bin/python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version
          from packaging.version import Version
          import xgboost

          floors = {
              "aiohttp": "3.14.3",
              "azure-core": "1.38.0",
              "cbor2": "5.9.0",
              "cryptography": "50.0.0",
              "curl-cffi": "0.15.0",
              "httplib2": "0.32.0",
              "json-repair": "0.60.1",
              "litellm": "1.84.0",
              "lxml": "6.1.1",
              "lxml-html-clean": "0.4.5",
              "mcp": "1.28.1",
              "mistune": "3.3.0",
              "nltk": "3.10.0",
              "orjson": "3.11.6",
              "pdfminer-six": "20251230",
              "pillow": "12.3.0",
              "protobuf": "5.29.6",
              "pyarrow": "23.0.1",
              "pyasn1": "0.6.4",
              "pyjwt": "2.13.0",
              "pypdf": "6.14.2",
              "setuptools": "84.0.0",
              "soupsieve": "2.8.4",
              "urllib3": "2.7.0",
              "xgboost-cpu": "2.1.4",
          }

          for distribution, floor in floors.items():
              resolved = Version(version(distribution))
              assert resolved >= Version(floor), f"{distribution} {resolved} < {floor}"

          assert xgboost.__version__ == version("xgboost-cpu")

          try:
              version("agentrun-sdk")
          except PackageNotFoundError:
              pass
          else:
              raise AssertionError("agentrun-sdk must not be in the MuseMind runtime")
          PY

      - name: Build the bundled Python SDK artifact
        run: |
          uv build --wheel --no-build-isolation sdk/python --out-dir /tmp/ragflow-sdk-dist
          test "$(find /tmp/ragflow-sdk-dist -maxdepth 1 -type f -name 'ragflow_sdk-*.whl' | wc -l)" -eq 1
          .venv/bin/python -m zipfile --list /tmp/ragflow-sdk-dist/ragflow_sdk-*.whl |
            grep -F 'ragflow_sdk/modules/dataset.py'

      - name: Compile MuseMind provider contract sources
        run: >-
          .venv/bin/python -m compileall -q
          api/apps/__init__.py
          api/apps/restful_apis/chunk_api.py
          api/apps/restful_apis/document_api.py
          api/db/services/file_service.py
          api/utils/musemind_provider_contract.py
          agent/sandbox/client.py
          agent/sandbox/providers/__init__.py
          rag/llm/chat_model.py
          rag/llm/embedding_model.py
          sdk/python/ragflow_sdk/modules/base.py
          sdk/python/ragflow_sdk/modules/dataset.py
          sdk/python/ragflow_sdk/ragflow.py

      - name: Lint MuseMind provider contract sources
        run: >-
          uvx --from ruff==0.16.0 ruff check --select E9,F
          api/apps/__init__.py
          api/apps/restful_apis/chunk_api.py
          api/apps/restful_apis/document_api.py
          api/db/services/file_service.py
          api/utils/musemind_provider_contract.py
          agent/sandbox/client.py
          agent/sandbox/providers/__init__.py
          rag/llm/chat_model.py
          rag/llm/embedding_model.py
          sdk/python/ragflow_sdk/modules/base.py
          sdk/python/ragflow_sdk/modules/dataset.py
          sdk/python/ragflow_sdk/ragflow.py
          test/testcases/test_http_api/test_file_management_within_dataset/test_doc_sdk_routes_unit.py
          test/unit_test/api/apps/test_auth_logging_contract.py
          test/unit_test/api/db/services/test_file_service_upload_document.py
          test/unit_test/api/utils/test_musemind_provider_contract.py
          test/unit_test/sdk/test_ragflow_request_timeout.py

      - name: Test remediated embedding provider contracts
        run: >-
          .venv/bin/pytest
          test/unit_test/rag/llm/test_embedding_model.py

      - name: Test exact retrieval route
        run: >-
          .venv/bin/pytest --noconftest
          test/testcases/test_http_api/test_file_management_within_dataset/test_doc_sdk_routes_unit.py::TestDocRoutesUnit::test_exact_retrieval_fails_closed_and_validates_provenance

      - name: Test create-only upload and token redaction
        run: >-
          .venv/bin/pytest
          test/unit_test/api/utils/test_musemind_provider_contract.py
          test/unit_test/api/apps/test_auth_logging_contract.py
          test/unit_test/api/db/services/test_file_service_upload_document.py::test_upload_document_skips_cross_kb_document_id_collision
          test/unit_test/api/db/services/test_file_service_upload_document.py::test_upload_document_create_only_never_reads_or_overwrites_existing_id

      - name: Test SDK timeout and exact wire contract
        run: .venv/bin/pytest test/unit_test/sdk/test_ragflow_request_timeout.py
